<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="nav-shell">
        <a class="site-title" href="{{ '/' | relative_url }}">Jacopo Marrone</a>

        <nav class="site-nav" aria-label="Main navigation">
          <button
            class="menu-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="site-menu"
          >
            Menu
            <span class="menu-chevron" aria-hidden="true">⌄</span>
          </button>
        </nav>
      </div>
    </header>

    <div class="menu-panel" id="site-menu" hidden>
      <ul>
        {% assign pages = site.pages | sort: "path" %}
        {% for nav_page in pages %}
          {% if nav_page.name contains ".md" and nav_page.url != "/" %}
            <li>
              <a href="{{ nav_page.url | relative_url }}">{{ nav_page.title | default: nav_page.name | remove: ".md" }}</a>
            </li>
          {% endif %}
        {% endfor %}
      </ul>
    </div>

    <main class="site-shell">
      <article class="profile">
        {{ content }}
      </article>
    </main>

    <script>
      (() => {
        const trigger = document.querySelector(".menu-trigger");
        const panel = document.querySelector("#site-menu");

        if (!trigger || !panel) return;

        const positionPanel = () => {
          const rect = trigger.getBoundingClientRect();
          panel.style.top = `${rect.bottom + 8}px`;
          panel.style.right = `${Math.max(10, window.innerWidth - rect.right)}px`;
        };

        const closeMenu = () => {
          trigger.setAttribute("aria-expanded", "false");
          panel.hidden = true;
        };

        const openMenu = () => {
          positionPanel();
          trigger.setAttribute("aria-expanded", "true");
          panel.hidden = false;
        };

        trigger.addEventListener("click", () => {
          const isOpen = trigger.getAttribute("aria-expanded") === "true";
          if (isOpen) closeMenu();
          else openMenu();
        });

        document.addEventListener("click", (event) => {
          if (!trigger.contains(event.target) && !panel.contains(event.target)) {
            closeMenu();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeMenu();
        });

        window.addEventListener("resize", () => {
          if (trigger.getAttribute("aria-expanded") === "true") {
            positionPanel();
          }
        });

        window.addEventListener("scroll", () => {
          if (trigger.getAttribute("aria-expanded") === "true") {
            positionPanel();
          }
        }, { passive: true });
      })();
    </script>
  </body>
</html>
