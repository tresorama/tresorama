<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="nav-shell">
        <a class="site-title" href="{{ '/' | relative_url }}">Jacopo Marrone</a>

        <nav class="site-nav" aria-label="Main navigation">
          <button
            class="menu-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="site-menu"
          >
            Menu
            <span class="menu-chevron" aria-hidden="true">⌄</span>
          </button>

          <div class="menu-panel" id="site-menu" hidden>
            <ul>
              {% assign pages = site.pages | sort: "path" %}
              {% for nav_page in pages %}
                {% if nav_page.name contains ".md" and nav_page.url != "/" %}
                  <li>
                    <a href="{{ nav_page.url | relative_url }}">{{ nav_page.title | default: nav_page.name | remove: ".md" }}</a>
                  </li>
                {% endif %}
              {% endfor %}
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <main class="site-shell">
      <article class="profile">
        {{ content }}
      </article>
    </main>

    <script>
      (() => {
        const trigger = document.querySelector(".menu-trigger");
        const panel = document.querySelector("#site-menu");

        if (!trigger || !panel) return;

        const closeMenu = () => {
          trigger.setAttribute("aria-expanded", "false");
          panel.hidden = true;
        };

        trigger.addEventListener("click", () => {
          const isOpen = trigger.getAttribute("aria-expanded") === "true";
          trigger.setAttribute("aria-expanded", String(!isOpen));
          panel.hidden = isOpen;
        });

        document.addEventListener("click", (event) => {
          if (!trigger.contains(event.target) && !panel.contains(event.target)) {
            closeMenu();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeMenu();
        });
      })();
    </script>
  </body>
</html>
