name: Deploy public profile site

on:
  push:
    branches:
      - master
    paths:
      - "public-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Markdown pages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public-site/website

          {
            echo "---"
            echo "layout: default"
            echo "title: Jacopo Marrone — Full-Stack Product Developer"
            echo "permalink: /"
            echo "---"
            cat public-site/contents/ai-summary.md
          } > public-site/website/index.md

          {
            echo "---"
            echo "layout: default"
            echo "title: Recruiter Notes"
            echo "permalink: /recrut/"
            echo "---"
            cat public-site/contents/recrut.md
          } > public-site/website/recrut.md

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public-site/website
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
