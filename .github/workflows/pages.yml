name: Deploy public profile site

on:
  push:
    branches:
      - master
    paths:
      - "public-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Markdown pages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf public-site/website/*.md
          find public-site/contents -type f -name '*.md' -print0 | while IFS= read -r -d '' source; do
            relative="${source#public-site/contents/}"
            destination="public-site/website/${relative}"

            mkdir -p "$(dirname "${destination}")"

            title="$(awk '
              match($0, /^# /) {
                sub(/^# /, "", $0)
                print
                exit
              }
            ' "${source}")"

            if [ -z "${title}" ]; then
              title="$(basename "${relative}" .md)"
            fi

            permalink="/${relative%.md}/"
            mkdir -p "$(dirname "${destination}")"

            {
              echo "---"
              printf 'title: "%s"\n' "${title//\"/\\\"}"
              printf 'permalink: "%s"\n' "${permalink}"
              echo "---"
              cat "${source}"
            } > "${destination}"
          done

          cat > public-site/website/index.md <<'EOF'
          ---
          layout: default
          title: Jacopo Marrone
          permalink: /
          ---

          # Jacopo Marrone

          Full-Stack Product Developer

          Select a page from the navigation menu.
          EOF

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./public-site/website
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
